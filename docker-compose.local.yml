# Локальная песочница: тот же образ, что на малине, но безопасная обвязка.
#
# Запуск:
#   docker compose -f docker-compose.local.yml up -d --build
#
# Файл самодостаточный, а не надстройка над боевым. Надстройка выглядела
# аккуратнее, но compose сливает списки, а не заменяет их: выключенный прокси
# оставался в зависимостях воркера, и проект переставал собираться вовсе.
# Отдельный файл читается проще и не ломается от правок в боевом.
#
# Три отличия от малины, каждое закрывает конкретную беду:
#
# 1. **Своя база** — ./data-local. Иначе опыты на ноутбуке правят ту же базу,
#    что уехала на малину, и посты расходятся.
# 2. **Прокси нет** — компьютер и так под VPN, лишний контейнер ест память.
# 3. **Бота нет.** Telegram не разрешает двум процессам опрашивать один токен:
#    они перехватывают нажатия друг у друга, и владелец видит случайные
#    пропажи. Нужен бот локально — заведите ВТОРОГО у @BotFather.
#
# Публикация тоже не боевая: локально подключается projects/demo, где все
# провайдеры — заглушки. Настоящая группа остаётся у малины.

services:
  worker:
    build: .
    image: factory:latest
    container_name: factory-worker-local
    volumes:
      - ./data-local:/data
      - ./projects:/projects:ro
    env_file:
      - ./data-local/.env
    environment:
      FACTORY_DATA_DIR: /data
      FACTORY_PROJECTS_DIR: /projects
      # Чаще, чем в бою: локально ждать минуту между шагами незачем.
      FACTORY_TICK_INTERVAL_SEC: "10"
    command: ["factory", "run", "--loop"]
    # Тот же номер владельца, что в боевом: файлы, созданные контейнером,
    # должны оставаться вашими, иначе их потом не прочитать без sudo.
    user: "1000:1000"
    # Перезапуска нет намеренно: на ноутбуке контейнер, поднимающийся сам после
    # каждой перезагрузки, — это фоновая работа, о которой забываешь и которая
    # однажды публикует что-нибудь неожиданное.
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
