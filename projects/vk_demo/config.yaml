# Боевая публикация в закрытую тестовую группу ВК.
#
# Отличается от projects/demo только тремя строками: publisher.provider,
# vk.group_id и vk.upload_token_env. Всё остальное — заглушки, потому что
# на этом этапе проверяется публикация и обложка, а не качество текстов.
#
# Секретов здесь нет и быть не может: указаны только ИМЕНА переменных,
# а сами ключи лежат в ~/factory-data/.env с правами 600.

slug: vk_demo

vk:
  group_id: 111222333            # закрытая группа «demo», два участника

  # Два ключа, и они не взаимозаменяемы:
  #   token_env        — ключ сообщества, умеет wall.post
  #   upload_token_env — ключ пользователя, умеет загружать картинки
  # Ни один не проходит цепочку целиком. Почему так — docs/ВК-как-это-работает.md
  token_env: VK_TOKEN_GROUP
  upload_token_env: VK_UPLOAD_TOKEN

  api_version: "5.199"
  schedule: ["19:30", "21:00"]
  timezone: "Europe/Moscow"

persona:
  name: "Кристина"
  voice_file: prompts/voice.md
  style_examples: prompts/examples/

llm:
  provider: openai_compatible
  base_url_env: LLM_BASE_URL       # https://routerai.ru/api/v1
  api_key_env: LLM_API_KEY

  # Пишет тексты: дёшево и живо по-русски.
  model: "deepseek/deepseek-v3.2"
  price_input_per_1m: 22.5         # ₽ за миллион токенов
  price_output_per_1m: 33.4

  # Проверяет факты — ОТДЕЛЬНАЯ модель, и это принципиально.
  # Проверено живьём: модель без поиска одобрила текст, где штраф был завышен
  # в сто раз, и сослалась на несуществующий пункт приказа.
  factcheck_model: "perplexity/sonar"
  factcheck_web_search: true
  factcheck_price_input_per_1m: 107.8
  factcheck_price_output_per_1m: 107.8

  # С запасом: модель с рассуждениями тратит лимит на размышления и при
  # тесном бюджете возвращает пустой ответ.
  max_tokens: 4000
  temperature: 1.0

image:
  provider: stub
  model: "stub"
  inline_count: 3
  cover_template: templates/red_frame.json
  scene_style: "cinematic photo, overcast light, 35mm, shallow depth of field"

publisher:
  provider: vk                   # боевая публикация, не заглушка

content:
  post_structure: [hook, story, detail, question]
  target_length: [900, 1400]
  factcheck: strict

review:
  mode: auto                     # переключить на telegram, когда бот заработает

telegram:
  # Куда приходят посты на одобрение. Узнать своё число: написать @userinfobot.
  chat_id: 123456789

  # Кто может нажимать кнопки. Бот находится обычным поиском в Telegram, и без
  # этого списка кнопка «Опубликовать» в вашу группу доступна любому, кто на
  # бота наткнулся. Пустой список система не примет.
  reviewers: [123456789]

limits:
  posts_per_day: 2
  queue_buffer: 6
  max_cost_per_post: 0.40
