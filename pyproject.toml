[project]
name = "factory"
version = "0.1.0"
description = "Контент-фабрика для автопостинга в VK"
requires-python = ">=3.11"
dependencies = [
    "httpx[socks]>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "pillow>=10.3",
    "typer>=0.12",
    "aiogram>=3.15,<4",
    "aiohttp-socks>=0.9",
    # Панель управления. Оба пакета чистый python: на arm64 ставятся
    # готовыми колёсами, собирать на малине нечего.
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # Загрузка своей картинки в пост: FastAPI разбирает multipart через него.
    "python-multipart>=0.0.9",
]

[project.scripts]
# Именно cli, а не app: cli() ловит FactoryError и печатает три части вместо
# трейсбека. Через app эта обёртка не выполняется вовсе.
factory = "factory.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["factory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "allow_network: разрешить тесту реальные HTTP-запросы (по умолчанию запрещены)",
]
